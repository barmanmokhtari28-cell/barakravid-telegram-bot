name: Check Tweets

on:
  schedule:
    # Runs 3x/day (every 8 hours), offset from :00 to dodge GitHub's busiest
    # scheduling slot at the top of the hour.
    # Widened from every 30 min specifically to fit ScraperAPI's free-tier
    # budget: Method 3 (premium=true proxy fallback) costs 10 credits/request
    # against a 1,000/month cap. At 3 runs/day this is ~90 requests/month
    # (~900 credits) even if every run needs the fallback, leaving a small
    # buffer. Posts to Telegram may lag up to ~8 hours behind the tweet as a
    # result - widen further or upgrade the ScraperAPI plan to tighten this.
    - cron: '7 */8 * * *'
  workflow_dispatch:        # Manual run button

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Bot Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          TWITTER_TARGET_USER: ${{ secrets.TWITTER_TARGET_USER }}
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
        run: python main.py

      - name: Save Last Checked Tweet ID
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add last_tweet_id.txt || true
          git commit -m "Update last checked tweet ID" || exit 0
          git push
