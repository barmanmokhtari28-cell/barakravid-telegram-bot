name: Check Tweets

on:
  schedule:
    # Runs every 30 minutes, offset from :00/:30.
    # GitHub queues scheduled runs globally and the top/half of every hour is the
    # busiest slot, where delays of 10-60+ minutes are common — :07/:37 avoids it.
    # A wider 30-min interval also means fewer requests against X overall, which
    # lowers the chance of tripping its anti-bot rate limiting.
    - cron: '7,37 * * * *'
  workflow_dispatch:        # Manual run button

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Bot Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          TWITTER_TARGET_USER: ${{ secrets.TWITTER_TARGET_USER }}
        run: python main.py

      - name: Save Last Checked Tweet ID
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add last_tweet_id.txt || true
          git commit -m "Update last checked tweet ID" || exit 0
          git push
